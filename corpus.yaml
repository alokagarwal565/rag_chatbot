    # Ingested through archive.org's existing OCR text layer (no re-OCR) to keep ingestion time down.
    force_ocr: false
    alternates: [practicalbotany00caverich]

# Used only if fewer than one scanned document could be fetched (or with --synthetic):
# rasterise pages of an OpenStax book at `dpi` into an image-only PDF.
synthetic:
  id: biology-2e-scanned-synthetic
  filename: biology-2e_scanned_synthetic.pdf
  title: Biology 2e — image-only synthetic scan (pp. 101-320)
  from: biology-2e
  first_page: 101
  page_count: 220
  dpi: 200
