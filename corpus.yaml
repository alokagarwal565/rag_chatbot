# Granth demo corpus. `python scripts/download_corpus.py` fetches every entry into data/pdfs/,
# verifies the page count with PyMuPDF, and writes data/pdfs/manifest.json + data/ATTRIBUTION.md.
#
# OpenStax entries resolve a fresh PDF URL (and the current license) from the OpenStax CMS API by
# `openstax_title`; `urls` are tried first and act as a fallback if the API is unreachable.
# archive.org entries are public-domain scans. Their PDFs carry archive.org's own OCR text layer,
# so they are marked force_ocr: Granth ignores that layer and OCRs every page itself.

min_pages: 200

documents:
  - id: biology-2e
    filename: biology-2e.pdf
    title: Biology 2e
    authors: Mary Ann Clark, Matthew Douglas, Jung Choi (OpenStax)
    source: openstax
    openstax_title: Biology 2e
    urls: [https://assets.openstax.org/oscms-prodcms/media/documents/Biology-2e_-_WEB.pdf]

  - id: chemistry-2e
